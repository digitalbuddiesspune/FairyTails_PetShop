# Nginx body size (legacy proxy upload only)
#
# Direct browser → S3 uploads do NOT send the file through nginx/API.
# Only POST /api/v1/admin/upload/presign (small JSON) hits your server.
#
# If you still use POST /api/v1/admin/upload/image (proxy), set:
# client_max_body_size 4M;

# Example server block (adjust paths/domains to match your server):

# server {
#     listen 80;
#     server_name api.fairytailspetshop.com;
#
#     client_max_body_size 4M;
#
#     location / {
#         proxy_pass http://127.0.0.1:3000;
#         proxy_http_version 1.1;
#         proxy_set_header Host $host;
#         proxy_set_header X-Real-IP $remote_addr;
#         proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
#         proxy_set_header X-Forwarded-Proto $scheme;
#     }
# }
#
# After editing:
#   sudo nginx -t
#   sudo systemctl reload nginx
#
# PM2 restart alone does NOT change nginx limits.
